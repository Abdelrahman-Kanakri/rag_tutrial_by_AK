[project]
name = "rag-tutorial"
version = "0.1.0"
description = "RAG From Scratch — A hands-on tutorial series building Retrieval-Augmented Generation systems with LangChain, from basic pipelines to advanced indexing (RAPTOR, ColBERT)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core LangChain ecosystem
    "langchain>=1.2.10",
    "langchain-core>=1.2.13",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.1.0",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.1",
    "langchain-openai>=1.1.10",
    "langchain-mistralai>=1.1.1",
    "langchain-huggingface>=1.2.1",
    "langgraph>=1.0.8",
    "langsmith>=0.7.3",

    # Vector store
    "chromadb>=1.5.0",

    # LLM & embeddings
    "tiktoken>=0.12.0",
    "transformers>=4.39.0,<4.40.0",
    "sentence-transformers>=5.2.3",

    # Data & ML (RAPTOR)
    "numpy>=2.4.0",
    "pandas>=2.3.0",
    "matplotlib>=3.10.0",
    "scikit-learn>=1.8.0",
    "umap-learn>=0.5.11",

    # ColBERT
    "ragatouille>=0.0.9",

    # Web loading & parsing
    "beautifulsoup4>=4.14.0",
    "requests>=2.32.0",

    # YouTube (Part 11)
    "pytubefix>=10.3.0",

    # Utilities
    "python-dotenv>=1.2.1",
    "pydantic>=2.12.0",
    "jupyter>=1.1.1",
]
